app-id: io.github.hamunii.Cogwork
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.dotnet10
build-options:
  append-path: /usr/lib/sdk/dotnet10/bin
  append-ld-library-path: /usr/lib/sdk/dotnet10/lib
  prepend-pkg-config-path: /usr/lib/sdk/dotnet10/lib/pkgconfig
command: io.github.hamunii.Cogwork
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=ipc
  - --share=network
  # As a game launcher, Cogwork may need all devices.
  - --device=all
  # I'm not actually sure if this is relevant, but maybe it is? Heroic Games Launcher (HGL) has it.
  - --allow=per-app-dev-shm
  # Some games may store files wherever
  - --persist=.
  #  From HGL: Wine uses UDisks2 to enumerate disk drives
  - --system-talk-name=org.freedesktop.UDisks2
  - --system-talk-name=org.freedesktop.UPower # from HGL
  - --talk-name=org.gnome.SettingsDaemon.MediaKeys # from HGL
  - --talk-name=org.freedesktop.PowerManagement # from HGL
  - --talk-name=org.freedesktop.Notifications # from HGL
  # From HGL: should fix discord rich presence
  - --filesystem=xdg-run/app/com.discordapp.Discord:create
  # Cogwork automatically finds Steam games which may be anywhere and
  # it must be able to write to game directories to inject mods into games.
  - --filesystem=~/.steam
  - --filesystem=xdg-data/Steam
  - --filesystem=~/.var/app/com.valvesoftware.Steam
  - --filesystem=~/Games
  - --filesystem=/run/media
  - --filesystem=/mnt
  - --filesystem=/media
  - --filesystem=xdg-desktop
  - --filesystem=xdg-documents
cleanup:
  - /include
  - /lib/debug
  - /lib/pkgconfig
  - /man
  - '*.a'
modules:
  - name: io.github.hamunii.Cogwork
    buildsystem: simple
    build-options:
      env:
        DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
        container: flatpak
      arch:
        aarch64:
          env:
            RUNTIME: linux-arm64
        x86_64:
          env:
            RUNTIME: linux-x64
    build-commands:
      - chmod +x ./resources/linux/publish-and-install.sh
      - ./resources/linux/publish-and-install.sh ${FLATPAK_DEST} $RUNTIME
    sources:
      - type: dir
        path: ..
      - nuget-sources.json
